name: Badge activity report (daily)

# One daily read-only report at 08:00 IST (02:30 UTC). No child workflows or badge-generating mutations.
'on':
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      acknowledge_runner_usage:
        description: 'Run one read-only report (uses one runner for at most 3 minutes)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: badge-report-${{ github.repository }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.acknowledge_runner_usage)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Report observed repository activity
        shell: bash
        run: |
          set -euo pipefail
          STARS=$(gh api "repos/$REPO" --jq '.stargazers_count')
          MERGED=$(gh api --method GET search/issues \
            -f "q=repo:$REPO is:pr is:merged" --jq '.total_count')
          CLOSED=$(gh api --method GET search/issues \
            -f "q=repo:$REPO is:issue is:closed" --jq '.total_count')
          {
            printf '%s\n' '# Repository activity report' ''
            printf '| Metric | Observed count |\n| --- | ---: |\n'
            printf '| Stars | %s |\n| Merged PRs | %s |\n| Closed issues | %s |\n' "$STARS" "$MERGED" "$CLOSED"
            printf '\n%s\n' 'These are repository counts, not verified GitHub Achievement awards or account-wide progress.'
            printf '\nCheck actual Achievements on [your profile](https://github.com/%s?tab=achievements).\n' "$OWNER"
            printf '\n%s\n' 'Scheduled badge hunters are disabled. This report does not create or merge PRs, open issues, add reactions, push commits, or send messages.'
          } >> "$GITHUB_STEP_SUMMARY"
